<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Audit — Red River AI</title>
    <meta name="description" content="Free 5-minute AI assessment for your business. Get a personalized report with 3 specific automation opportunities.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-wrapper">
            <a href="/" class="nav-logo">
                <img src="logo-full-transparent.png" alt="Red River AI" class="nav-logo-img">
            </a>
            <ul class="nav-menu">
                <li><a href="/#services">Services</a></li>
                <li><a href="/#pricing">Pricing</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="https://calendly.com/redriverai/30min" target="_blank" rel="noopener" class="nav-cta">Book a Call</a></li>
            </ul>
        </div>
    </nav>

    <section class="audit-form" style="max-width: 600px; margin: 4rem auto; padding: 2rem;">
        <h1>Free AI Audit</h1>
        <p style="margin-bottom: 2rem;">Answer a few quick questions and we'll send you a personalized report showing exactly where AI can save your business time and money.</p>

        <form id="audit-form" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <label for="name" style="font-weight: 600;">Your Name *</label>
                <input type="text" id="name" name="name" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem;">
            </div>
            <div>
                <label for="business" style="font-weight: 600;">Business Name *</label>
                <input type="text" id="business" name="business" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem;">
            </div>
            <div>
                <label for="email" style="font-weight: 600;">Email Address *</label>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem;">
            </div>
            <div>
                <label for="timeWaster" style="font-weight: 600;">What's your biggest time-waster? *</label>
                <textarea id="timeWaster" name="timeWaster" rows="3" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem;" placeholder="e.g. data entry, scheduling, answering the same questions over and over..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="font-size: 1.1rem; padding: 1rem;">Get My Free Audit Report</button>
        </form>
        <div id="audit-success" style="display: none; text-align: center; padding: 2rem; background: #f0fff0; border-radius: 8px; margin-top: 1rem;">
            <h3>✅ Thank you!</h3>
            <p>Your AI audit report will arrive in your inbox within 24 hours.</p>
            <a href="/" class="btn btn-secondary" style="margin-top: 1rem;">Back to Home</a>
        </div>
    </section>

    <script>
    document.getElementById('audit-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const form = e.target;
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Generating your audit...';

        try {
            const response = await fetch('https://automatemybuisness.oph.st/webhook/ai-audit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    body: {
                        name: document.getElementById('name').value,
                        business: document.getElementById('business').value,
                        email: document.getElementById('email').value,
                        timeWaster: document.getElementById('timeWaster').value
                    }
                })
            });

            if (response.ok) {
                document.getElementById('audit-form').style.display = 'none';
                document.getElementById('audit-success').style.display = 'block';
            } else {
                throw new Error('Submission failed');
            }
        } catch (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Get My Free Audit Report';
            alert('Something went wrong. Please try again or email hello@redriverai.ca directly.');
        }
    });
    </script>
</body>
</html>
